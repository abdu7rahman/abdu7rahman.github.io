<!-- The written site is the same content as a document, and it is the
     canonical copy: tools/bake_content.py generates the lab's panels from
     it. Declared here so a reader who wants the page rather than the
     building can find it, and so a crawler knows the two are one thing. -->
<link rel="alternate" type="text/html" href="/written.html" title="The same work, written">
</head>
<body>
<div id="root"></div>

<!-- The wait, and what it is waiting on.

     This page is a 1.3 MB module that builds a sixty-seven metre building
     before it draws a pixel of it, and until this markup existed what a
     reader got in the meantime was the background colour. Written here and
     not in the app for the reason that matters: the stylesheet is
     render-blocking and arrives with the document, so this is on screen at
     first paint -- while the module that would have rendered it is still
     being parsed. lib/door.js fills the counts in and takes it away.

     Static text, no counts, until something real has happened: an empty
     "0 of 0" is a worse first frame than no number at all. -->
<div id="door" data-state="open" data-mode="loading">
  <p class="door-h">High bay</p>
  <p class="door-l">Motion planning, manipulation and physical AI. Eight test
     cells running published controllers under real physics, and the same work
     written down.</p>
  <ul class="door-s" role="status" aria-live="polite">
    <li data-step="machines" data-state="wait">the machines <b data-note></b></li>
    <li data-step="building" data-state="wait">the building <b data-note></b></li>
  </ul>
  <!-- The fork, and it is hidden until the building behind it is actually
       ready to be walked into. Offering a door that is not yet open is worse
       than making somebody wait for it, because the wait then happens after
       the click with nothing on screen to explain it. -->
  <div class="door-pick" hidden>
    <button type="button" class="door-go" data-pick="walk">
      Walk the building
      <em>eight live cells and a guide that takes you round</em>
    </button>
    <a class="door-go door-go--alt" href="/written.html" data-pick="read">
      Read it as a document
      <em>the same work, benchmarks and all, on one page</em>
    </a>
  </div>
</div>

<!-- The two pieces of chrome that are not React's, and are here rather than
     in the app for one reason each.

     The written link, because a reader who wants the document should not
     have to walk sixty-six metres to the office to find out it exists, and
     because on a phone the building is the expensive way to read a table.

     The visit count, because visits.js is a deferred classic script and runs
     before the module that mounts the app -- so an element React renders is
     an element the counter finds missing and gives up on. Static markup is
     the only thing that is there when it looks. It stays hidden unless a
     real number arrives; that rule is the script's and it is the right one. -->
<footer class="edge">
  <a href="/written.html">Read it as a document</a>
  <p id="visits" hidden><span data-count></span> visits</p>
</footer>

<noscript>
  <!-- This used to point at /index.html, which is this page: a reader with no
       JavaScript was sent to the document they were already failing to
       load. -->
  <p>This is a WebGL facility and it needs JavaScript. The written version of
     everything in it is at <a href="/written.html">the document site</a>.</p>
</noscript>
<!-- The analytics beacon and the visit counter are appended by the
     transformIndexHtml hook in vite.config.js, not written here: Vite tries
     to bundle any script tag it finds in this file and warns on every build
     about the two it cannot, and bundling them is exactly wrong -- one of
     them is found by document.querySelector on its own tag. See the note in
     the config for the whole reason. -->
<script type="module" src="/src/main.jsx"></script>
</body>
</html>

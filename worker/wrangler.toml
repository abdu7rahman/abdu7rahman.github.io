name = "gemini-er-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
# The only place the model name appears. Google retires these previews on a
# schedule -- 1.5 is already gone and 1.6 retires 31 August 2026 -- so moving
# to the next one is this line and a redeploy.
MODEL = "gemini-robotics-er-2-preview"

# Comma separated, exact origins. No scheme-less entries, no wildcards: the
# Worker compares against the Origin header verbatim.
ALLOWED_ORIGINS = "https://abdu7rahman.github.io,http://127.0.0.1:8899,http://localhost:8899"

# GEMINI_API_KEY is a secret, not a var. Set it with:
#   wrangler secret put GEMINI_API_KEY

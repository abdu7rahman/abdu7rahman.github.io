<head>
<meta charset="utf-8">

<title>No path found — Mohammed Abdul Rahman</title>
<meta name="description" content="That page does not exist. Back to the portfolio, or run the robots in your browser.">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Absolute paths, not relative: GitHub Pages serves this file for a miss at
     any depth, so /demo/nope would resolve style.css against /demo/. -->
<link rel="stylesheet" href="/style.css?v=8069d1b0">
<style>
  .lost { min-height: 100vh; display: grid; place-content: center; text-align: center;
          padding: var(--gutter); gap: 6px; }
  .lost__code { font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
                color: var(--signal); }
  .lost__title { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.4rem, 7vw, 4rem);
                 line-height: 1.02; letter-spacing: -.03em; margin: 14px 0 0;
                 text-shadow: 0 0 1px rgba(255, 249, 240, .5), 0 0 22px rgba(255, 138, 92, .24); }
  .lost__lede { margin: 16px auto 0; max-width: 46ch; color: var(--ink-2); line-height: 1.6; }
  .lost__acts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 30px; }
  /* style.css draws a read-position bar off scroll(root block). This page is
     exactly one viewport tall by construction -- .lost is min-height: 100vh
     and nothing here is longer than it, measured at 900 of 900 at 1440x900
     and 844 of 844 at 390x844 -- so the timeline has no range at all and the
     animation is parked on its `to` frame. What that draws is scaleX(1): a
     2px #ff8a5c rule across every one of the 1440 pixels of the top edge,
     read straight off the screenshot, telling a reader they have finished
     reading a page with nothing on it. The bar belongs to a long document,
     and this is the one page on the site that can never be one. */
  body.err::after { display: none; }
</style>
</head>
<body class="err">

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 14 9-14 9V3z"/></symbol>
  </defs>
</svg>

<main class="lost" id="main">
  <p class="lost__code">404 &middot; no path found</p>
  <h1 class="lost__title">The planner<br>returned empty</h1>
  <p class="lost__lede">
    There is nothing at this address. Either the goal is outside the map or it is
    sitting inside an obstacle &mdash; both come back the same way.
  </p>
  <div class="lost__acts">
    <a class="btn btn--solid" href="/">
      <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg><span>Back to the start pose</span>
    </a>
    <a class="btn" href="/demo.html">
      <svg class="ico" aria-hidden="true"><use href="#i-play"/></svg><span>Run my robots</span>
    </a>
  </div>
</main>

<!-- Root-absolute for the same reason the stylesheet at the top of the file is,
     which this one line did not follow. Served for /demo/deeper/nope, a bare
     field.js resolves against /demo/deeper/ and comes back a 404, and the
     shader is the only thing on this page besides the type. Measured against a
     server that answers a miss the way Pages does: one canvas.bg-field at
     /nope and at /a/b/c/nope, zero at /demo/deeper/nope, with the stamped
     field script logged at 404 under /demo/deeper/. tools/stamp.py strips the
     leading slash before it hashes, so the stamp is unaffected -- and the
     filename is written without an attribute around it here because the same
     pattern in a comment is one stamp.py would rewrite. -->
<script src="/field.js?v=1c23bf3b" defer></script>
</body>
</html>
